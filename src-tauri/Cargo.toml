[package]
name = "serialpilot"
version = "0.1.0"
description = "AI Collaborative Serial Debugging Tool"
authors = ["SerialPilot Team"]
license = "MIT"
repository = ""
edition = "2021"

[package.metadata.tauri]
identifier = "com.serialpilot.app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
serialport = "4.3"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"


[features]
custom-protocol = ["tauri/custom-protocol"]
